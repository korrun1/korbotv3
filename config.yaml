# ⚙️ KorBot X Enhanced - Configuration File
# Version: 2.0 - Enhanced & Optimized
# Date: 2026-02-16

# 🔐 SECURITY WARNING
# Store sensitive data in environment variables or .env file
# Never commit API keys, tokens, or passwords to version control

---
# 📊 Trading Configuration
trading:
  # Default symbol
  symbol: "AUDCAD"
  
  # Mode: 'paper' or 'live' (ALWAYS start with paper!)
  mode: "paper"
  
  # Timeframes for strategies
  timeframes:
    scalping: "M1"
    mean_reversion: "M5"
    breakout: "H1"
    swing: "H4"
  
  # Enabled strategies (true/false)
  strategies:
    scalping: true
    mean_reversion: true
    breakout: true
    adaptive_swing: true

---
# 🛡️ Risk Management
risk:
  # Base risk per trade (% of account)
  base_risk_percent: 0.8
  
  # Maximum drawdown allowed (% of account)
  max_drawdown_percent: 5.0
  
  # Maximum daily loss (% of account)
  max_daily_loss_percent: 3.0
  
  # Maximum concurrent positions
  max_positions: 3
  
  # Maximum exposure per symbol (% of account)
  max_symbol_exposure_percent: 3.0
  
  # Circuit breaker settings
  circuit_breaker:
    enabled: true
    max_consecutive_losses: 3
    cooldown_minutes: 60
    
  # Stop loss settings
  stop_loss:
    type: "atr_based"  # 'fixed' or 'atr_based'
    atr_multiplier: 2.0
    min_pips: 10
    max_pips: 50
    
  # Take profit settings
  take_profit:
    risk_reward_ratio: 2.5
    use_trailing: true
    trailing_atr_multiplier: 1.5

---
# 🤖 AI & Machine Learning
ai:
  # XGBoost Confidence Model
  xgboost:
    enabled: true
    min_confidence: 0.65
    retrain_every_trades: 1000
    features:
      - "price_momentum"
      - "volume_profile"
      - "volatility_regime"
      - "trend_strength"
      - "rsi_divergence"
      - "market_microstructure"
      - "time_features"
      - "correlation_features"
  
  # PPO Exit Optimization
  ppo:
    enabled: true
    learning_rate: 0.0003
    gamma: 0.99
    clip_epsilon: 0.2
    value_coef: 0.5
    entropy_coef: 0.01
  
  # Bayesian Optimization (replaces GA)
  bayesian_optimization:
    enabled: true
    n_iterations: 100
    n_initial_points: 20
    acquisition_function: "EI"  # Expected Improvement

---
# 📈 Strategy Parameters
strategies:
  scalping:
    ema_fast: 5
    ema_slow: 13
    volume_threshold: 1.5  # Multiple of average volume
    min_atr: 0.0005  # Minimum volatility
    time_filters:
      avoid_news: true
      trading_hours: "00:00-23:59"  # UTC
    
  mean_reversion:
    bollinger_period: 20
    bollinger_std: 2.0
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    stochastic_period: 14
    stochastic_threshold: 20
    volume_confirmation: true
    
  breakout:
    atr_period: 14
    atr_multiplier: 1.5
    volume_surge: 2.0  # Multiple of average
    support_resistance_lookback: 50
    confirmation_candles: 2
    
  adaptive_swing:
    ema_fast: 20
    ema_slow: 50
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    adx_period: 14
    adx_threshold: 25

---
# 💾 Database Configuration
database:
  sqlite:
    path: "data/historical.sqlite"
    wal_mode: true
    batch_write_interval: 10  # seconds
    
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null  # Set in environment variable
    use_pipeline: true
    pipeline_size: 100

---
# 📱 Notifications
telegram:
  enabled: true
  # IMPORTANT: Set these in environment variables!
  # TELEGRAM_TOKEN=your_token
  # TELEGRAM_CHAT_ID=your_chat_id
  async_mode: true
  message_queue_size: 100
  
  # What to notify
  notifications:
    trade_opened: true
    trade_closed: true
    daily_summary: true
    circuit_breaker: true
    errors: true
    performance_milestones: true

---
# 🔧 Performance & Optimization
performance:
  # Caching
  cache:
    enabled: true
    max_size: 1000
    ttl_seconds: 60
    
  # Rust processing
  rust:
    enabled: true
    indicators_in_rust: true
    pattern_recognition: true
    
  # Multiprocessing
  multiprocessing:
    enabled: false  # Set to true if needed
    num_workers: 4

---
# 📊 Backtesting
backtesting:
  # Historical data range
  start_date: "2023-01-01"
  end_date: "2025-12-31"
  
  # Execution realism
  slippage_pips: 0.5
  commission_pips: 0.2
  latency_ms: 50
  
  # Validation
  train_ratio: 0.6
  validate_ratio: 0.2
  test_ratio: 0.2
  
  # Walk-forward
  walk_forward:
    enabled: true
    training_months: 12
    testing_months: 3
    
  # Monte Carlo
  monte_carlo:
    enabled: true
    simulations: 1000
    
  # Metrics to track
  metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"
    - "recovery_factor"
    - "mae"
    - "mfe"

---
# 📝 Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # 'json' or 'text'
  
  files:
    main: "logs/korbot.log"
    trades: "logs/trades.log"
    errors: "logs/errors.log"
    performance: "logs/performance.log"
    
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5
    
  console_output: true

---
# 🖥️ GUI Settings
gui:
  theme: "dark"
  refresh_rate_ms: 1000
  auto_scroll_logs: true
  show_charts: true
  
  panels:
    overview: true
    strategy: true
    risk: true
    performance: true
    logs: true

---
# 🔄 System
system:
  # Auto-restart on crash
  auto_restart: true
  max_restart_attempts: 3
  
  # Health check
  health_check_interval: 30  # seconds
  
  # Data refresh
  data_refresh_interval: 1  # seconds for live data
  
  # Cleanup
  cleanup_old_logs_days: 30
  cleanup_old_trades_days: 365

---
# 🧪 Testing & Development
development:
  debug_mode: false
  profiling: false
  test_mode: false
  mock_mt5: false  # Use mock data instead of MT5

---
# END OF CONFIGURATION
