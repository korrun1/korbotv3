[package]
name = "korbot_core"
version = "2.0.0"
edition = "2021"
authors = ["KorBot Team"]
description = "High-performance core for KorBot X Enhanced"

[lib]
name = "korbot_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"  # Parallel processing
csv = "1.3"

# Technical indicators
ta = "0.5"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "indicators_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
